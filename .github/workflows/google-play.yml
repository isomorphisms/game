name: Google Play app bundles

on:
  pull_request:
    paths:
      - '.github/workflows/google-play.yml'
      - 'scripts/build_google_play_bundle.sh'
      - 'docs/google-play-release.md'
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        required: true
        type: choice
        options:
          - cheetah
          - salon
      version_code:
        description: New, permanently increasing Play version code
        required: true
        type: string
      version_name:
        description: User-visible version, such as 0.1.0
        required: true
        type: string
      destination:
        description: Keep the bundle as an artifact for the first manual upload, or send it to internal testing
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - internal-track
      release_status:
        description: State of an internal-track release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-games-${{ github.event_name == 'workflow_dispatch' && inputs.app || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cheetah
            source_ref: cheetah
          - app: salon
            source_ref: animal-salon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: automation

      - name: Check out game source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ matrix.source_ref }}
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Cheetah Android requirements
        if: matrix.app == 'cheetah'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'

      - name: Install salon Android requirements
        if: matrix.app == 'salon'
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.1' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'

      - name: Install Godot 4.7.1
        if: matrix.app == 'salon'
        shell: bash
        run: |
          set -euo pipefail
          release=4.7.1-stable
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${release}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Create disposable validation key
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.p12 \
            -storetype PKCS12 \
            -storepass validation-only \
            -keypass validation-only \
            -alias validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Validation'

      - name: Build signed validation bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/ci-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: validation-only
          ANDROID_UPLOAD_KEY_ALIAS: validation
          ANDROID_UPLOAD_KEY_PASSWORD: validation-only
        run: automation/scripts/build_google_play_bundle.sh '${{ matrix.app }}' source dist 1 ci

      - name: Save validation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.app }}-validation-aab
          path: dist/*.aab
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play-${{ inputs.app }}
    steps:
      - name: Check out release automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: automation

      - name: Check out selected game
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.app == 'cheetah' && 'cheetah' || 'animal-salon' }}
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Cheetah Android requirements
        if: inputs.app == 'cheetah'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'

      - name: Install salon Android requirements
        if: inputs.app == 'salon'
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.1' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'

      - name: Install Godot 4.7.1
        if: inputs.app == 'salon'
        shell: bash
        run: |
          set -euo pipefail
          release=4.7.1-stable
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${release}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Restore private upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > /tmp/play-upload.p12

      - name: Build signed app bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/play-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: automation/scripts/build_google_play_bundle.sh '${{ inputs.app }}' source dist '${{ inputs.version_code }}' '${{ inputs.version_name }}'

      - name: Save signed app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.app }}-${{ inputs.version_name }}-aab
          path: dist/*.aab
          if-no-files-found: error

      - name: Require Google Play credential
        if: inputs.destination == 'internal-track'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$SERVICE_ACCOUNT_JSON"

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal-track'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.app == 'cheetah' && 'org.isomorphisms.cheetah' || 'org.isomorphisms.dresstheunicorn' }}
          releaseFiles: dist/*.aab
          tracks: internal
          status: ${{ inputs.release_status }}
          releaseName: ${{ inputs.version_name }}
