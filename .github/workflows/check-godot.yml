name: Check Godot project

on:
  push:
    branches: [animal-salon]
  pull_request:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/check-godot.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          RELEASE=4.7.1-stable
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${RELEASE}/Godot_v${RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${RELEASE}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Parse project and script
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          godot --headless --path . --check-only --script scripts/main.gd
