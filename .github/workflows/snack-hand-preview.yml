name: Build snack hand preview

on:
  push:
    branches: [agent/snacks-in-animal-hand]

permissions:
  contents: write

jobs:
  android-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out snack hand branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android requirements
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            'platform-tools' \
            'build-tools;35.0.1' \
            'platforms;android-35' \
            'cmake;3.10.2.4988404' \
            'ndk;28.1.13356709'

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=4.7.1
          RELEASE="${VERSION}-stable"
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${RELEASE}/Godot_v${RELEASE}_linux.x86_64.zip"
          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${RELEASE}/Godot_v${RELEASE}_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${RELEASE}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          godot --version

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Restore development signing key
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode .github/android-dev.keystore.b64 > /tmp/game-dev.keystore

      - name: Build installable APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/game-dev.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: game
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: game-release-dev
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release Android dist/zebra-salon-snacks-in-hand.apk
          test -s dist/zebra-salon-snacks-in-hand.apk

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-salon-snacks-in-hand
          path: dist/zebra-salon-snacks-in-hand.apk
          if-no-files-found: error

      - name: Record preview run
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/last-snack-hand-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-snack-hand-run
          git commit -m "Record snack hand preview run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:agent/snacks-in-animal-hand
